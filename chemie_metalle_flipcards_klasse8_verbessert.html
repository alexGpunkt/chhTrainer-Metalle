const CAT_COLORS = {
  "Eigenschaften": {
    "bg": "#E1F5EE",
    "color": "#0F6E56"
  },
  "Metallbindung": {
    "bg": "#EEF2FF",
    "color": "#4742A0"
  },
  "Metallgewinnung": {
    "bg": "#E6F1FB",

  },
  "Redox & Sauerstoff": {

  },
  "Alltag": {
    "bg": "#E1F5EE",
    "color": "#0F6E56"
  },
  "PSE": {
    "bg": "#E6F1FB",
    "color": "#185FA5"
  }
};

const CATS = [...new Set(ALL_CARDS.map(c=>c.cat))];
let activeCats = new Set(CATS);
let deck = [];
let idx = 0;
let isFlipped = false;
let status = {};

function buildDeck() {
  deck = ALL_CARDS.filter(c=>activeCats.has(c.cat));
  idx = 0;
  isFlipped = false;
  document.getElementById('cardInner').classList.remove('flipped');
  document.getElementById('knownRow').style.visibility='hidden';
  renderCard();
}

function shuffle() {
  for(let i=deck.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [deck[i],deck[j]]=[deck[j],deck[i]];
  }
  idx = 0;
  isFlipped = false;
  document.getElementById('cardInner').classList.remove('flipped');
  document.getElementById('knownRow').style.visibility='hidden';
  renderCard();
}

function flipCard() {
  isFlipped = !isFlipped;
  document.getElementById('cardInner').classList.toggle('flipped', isFlipped);
  document.getElementById('knownRow').style.visibility = isFlipped ? 'visible' : 'hidden';
}

function navigate(dir) {
  idx = Math.max(0, Math.min(deck.length-1, idx+dir));
  isFlipped = false;
  document.getElementById('cardInner').classList.remove('flipped');
  document.getElementById('knownRow').style.visibility='hidden';
  renderCard();
}

function markCard(known) {
  const key = deck[idx].q;
  status[key] = known ? 'known' : 'unknown';
  updateStats();
  if(idx < deck.length-1) setTimeout(()=>navigate(1), 300);
}

function updateStats() {
  let k=0,u=0;
  deck.forEach(c=>{ const s=status[c.q]; if(s==='known')k++; else if(s==='unknown')u++; });
  const open = deck.length - k - u;
  document.getElementById('knownCount').textContent = k;
  document.getElementById('unknownCount').textContent = u;
  document.getElementById('openCount').textContent = open;
  const pct = deck.length ? Math.round((k/deck.length)*100) : 0;
  document.getElementById('progFill').style.width = pct+'%';
  document.getElementById('progText').textContent = pct+' %';
}

function renderCard() {
  if(!deck.length) {
    document.getElementById('questionText').textContent='Keine Karte in dieser Kategorie.';
    document.getElementById('answerText').textContent='';
    document.getElementById('hintText').textContent='';
    document.getElementById('catLabel').textContent='';
    document.getElementById('cardCounter').textContent='0 / 0';
    document.getElementById('prevBtn').disabled=true;
    document.getElementById('nextBtn').disabled=true;
    return;
  }
  const card = deck[idx];
  const col = CAT_COLORS[card.cat] || {bg:'#E1F5EE',color:'#0F6E56'};
  document.getElementById('questionText').textContent=card.q;
  document.getElementById('answerText').textContent=card.a;
  document.getElementById('hintText').textContent=card.hint ? '💡 '+card.hint : '';
  const lbl = document.getElementById('catLabel');
  lbl.textContent=card.cat;
  lbl.style.background=col.bg;
  lbl.style.color=col.color;
  document.getElementById('cardCounter').textContent=(idx+1)+' / '+deck.length;
  document.getElementById('prevBtn').disabled=idx===0;
  document.getElementById('nextBtn').disabled=idx===deck.length-1;
  updateStats();
}

function buildCatBtns() {
  const cont = document.getElementById('catControls');
  const allBtn = document.createElement('button');
  allBtn.type='button';
  allBtn.className='cat-btn active';
  allBtn.id='cat-all';
  allBtn.textContent='Alle';
  allBtn.onclick=()=>{ activeCats=new Set(CATS); document.querySelectorAll('.cat-btn').forEach(b=>{b.classList.toggle('active',b.id==='cat-all'||b.dataset.cat&&activeCats.has(b.dataset.cat))}); buildDeck(); };
  cont.appendChild(allBtn);
  CATS.forEach(cat=>{
    const btn=document.createElement('button');
    btn.type='button';
    btn.className='cat-btn active';
    btn.dataset.cat=cat;
    btn.textContent=cat;
    btn.onclick=()=>{
      if(activeCats.has(cat)&&activeCats.size>1) activeCats.delete(cat);
      else activeCats.add(cat);
      btn.classList.toggle('active',activeCats.has(cat));
      const allAct = CATS.every(c=>activeCats.has(c));
      document.getElementById('cat-all').classList.toggle('active',allAct);
      buildDeck();
    };
    cont.appendChild(btn);
  });
}

buildCatBtns();
shuffle();
</script>
